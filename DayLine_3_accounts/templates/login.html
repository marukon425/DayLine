{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン</title>
    <link rel="stylesheet" href="{% static 'css/DayLine_style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login_signup/login_signup.css' %}">
    <script src="{% static 'js/accounts/other.js' %}" defer></script>
    <link rel="icon" href="{% static "img/favicon.ico" %}" >
</head>
    <body>
        <header>
            <a href="{% url "DayLine_2_top:top" %}">
                <div class="app-icon"><img src="{% static 'img/DayLine2.svg' %}" alt=""></div>
            </a>
            <div class="header-content">
                <a href="{% url 'DayLine_2_top:contact' %}" id="contact">問い合わせ</a>
                <a href="{% url 'DayLine_3_accounts:signup' %}" class="change-signup-login">サインアップ</a>
            </div>
        </header>
        <main>
            <div class="login-signup">
                <div class="login-signup-header">ログイン</div>
                <form method="POST" action="" id="signup-form" class="signup-login-form">
                    {% csrf_token %}
                    <div id="signup-form-inputs">
                        <div class="name-mail">
                            <p class="sginup-feeld-name">メールアドレス</p>
                            <input name="username" type="text" placeholder="example@email.com">
                            <p class="sginup-feeld-name">パスワード</p>
                            <input name="password" type="text" placeholder="●●●●●●●●●●●●">
                        </div>
                        {% if form.errors %}
                            <p class="signup-error">ユーザー名かパスワードが間違っています。</p>
                        {% endif %}
                        <p><input type="checkbox" name="remember" id="remember"><label for="remember">ログインしたままにする</label></p>
                        <a href="{% url "DayLine_3_accounts:passfor" %}" id="password-forget">パスワードを忘れましたか？</a>
                        <div>
                            <button type="submit" class="login-submit" id="login-btn">ログイン</button>
                        </div>
                        <div class="google-divider">
                            <div class="google-divider-line"></div>
                            <span class="google-divider-text">または</span>
                            <div class="google-divider-line"></div>
                        </div>
                        <a href="{% provider_login_url 'google' %}" class="google-login-btn">
                            <svg viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                                <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                            </svg>
                            Googleでログイン
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </body>
</html>
